name: zhongyan-uav-local

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
      args:
        POSTGIS_IMAGE: ${BMS_POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    image: zhongyan-uav-postgres:16-postgis-pgvector
    container_name: zhongyan-uav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BMS_DB_NAME:-zhongyan_uav}
      POSTGRES_USER: ${BMS_DB_USERNAME:-zhongyan}
      POSTGRES_PASSWORD: ${BMS_DB_PASSWORD:-zhongyan_local}
      TZ: Asia/Shanghai
    ports:
      - "${BMS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: ${BMS_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: zhongyan-uav-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${BMS_REDIS_PASSWORD:-zhongyan_redis_local}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${BMS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: ${BMS_KAFKA_IMAGE:-apache/kafka:3.9.1}
    container_name: zhongyan-uav-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${BMS_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "${BMS_KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: ${BMS_KAFKA_IMAGE:-apache/kafka:3.9.1}
    container_name: zhongyan-uav-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPICS: >
        task-events:3:1
        device-commands:3:1
        asset-events:3:1
        uav-telemetry:3:1
        agent-events:3:1
        dead-letter-events:3:1
    volumes:
      - ./init/kafka/create-topics.sh:/opt/kafka/init/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/kafka/init/create-topics.sh"]
    restart: "no"

  minio:
    image: ${BMS_MINIO_IMAGE:-minio/minio:latest}
    container_name: zhongyan-uav-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${BMS_MINIO_ACCESS_KEY:-zhongyan}
      MINIO_ROOT_PASSWORD: ${BMS_MINIO_SECRET_KEY:-zhongyan_minio_local}
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${BMS_MINIO_API_PORT:-9000}:9000"
      - "${BMS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: ${BMS_MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: zhongyan-uav-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BMS_MINIO_ACCESS_KEY: ${BMS_MINIO_ACCESS_KEY:-zhongyan}
      BMS_MINIO_SECRET_KEY: ${BMS_MINIO_SECRET_KEY:-zhongyan_minio_local}
      BMS_MINIO_BUCKET: ${BMS_MINIO_BUCKET:-zhongyan-uav-assets}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${BMS_MINIO_ACCESS_KEY}" "$${BMS_MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BMS_MINIO_BUCKET}"
        mc anonymous set none "local/$${BMS_MINIO_BUCKET}"
    restart: "no"

  geoserver:
    image: ${BMS_GEOSERVER_IMAGE:-docker.osgeo.org/geoserver:2.25.2}
    container_name: zhongyan-uav-geoserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${BMS_GEOSERVER_USERNAME:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${BMS_GEOSERVER_PASSWORD:-geoserver}
      SKIP_DEMO_DATA: ${BMS_GEOSERVER_SKIP_DEMO_DATA:-true}
      PROXY_BASE_URL: ${BMS_GEOSERVER_PUBLIC_URL:-http://localhost:8080/geoserver}
      TZ: Asia/Shanghai
    ports:
      - "${BMS_GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data

  agent-model:
    image: ${BMS_AGENT_MODEL_IMAGE:-ollama/ollama:latest}
    container_name: zhongyan-uav-agent-model
    profiles:
      - agent
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      TZ: Asia/Shanghai
    ports:
      - "${BMS_AGENT_MODEL_PORT:-11434}:11434"
    volumes:
      - agent-model-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: ${BMS_PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: zhongyan-uav-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${BMS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: ${BMS_GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    container_name: zhongyan-uav-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${BMS_GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${BMS_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    ports:
      - "${BMS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  geoserver-data:
  agent-model-data:
  prometheus-data:
  grafana-data:
