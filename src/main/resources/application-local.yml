spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude: []
  datasource:
    url: ${BMS_DB_URL:jdbc:postgresql://localhost:5432/zhongyan_uav}
    username: ${BMS_DB_USERNAME:zhongyan}
    password: ${BMS_DB_PASSWORD:zhongyan_local}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      repositories:
        enabled: false
      host: ${BMS_REDIS_HOST:localhost}
      port: ${BMS_REDIS_PORT:6379}
      password: ${BMS_REDIS_PASSWORD:zhongyan_redis_local}
      database: ${BMS_REDIS_DATABASE:0}
      timeout: 2s
  kafka:
    bootstrap-servers: ${BMS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${BMS_KAFKA_CLIENT_ID:zhongyan-uav-local}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${BMS_KAFKA_CONSUMER_GROUP:zhongyan-uav-local}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

bms:
  repository:
    mode: ${BMS_REPOSITORY_MODE:jpa}
  event:
    publisher: ${BMS_EVENT_PUBLISHER:kafka}
    consumer: ${BMS_EVENT_CONSUMER:kafka}
  device-mode: mock
  device:
    command:
      connect-timeout-ms: ${BMS_DEVICE_CONNECT_TIMEOUT_MS:5000}
      retry-max-attempts: ${BMS_DEVICE_RETRY_MAX_ATTEMPTS:1}
      retry-backoff-ms: ${BMS_DEVICE_RETRY_BACKOFF_MS:250}
      circuit-failure-threshold: ${BMS_DEVICE_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration-ms: ${BMS_DEVICE_CIRCUIT_OPEN_DURATION_MS:30000}
  asset:
    storage:
      enabled: true
      endpoint: ${BMS_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${BMS_MINIO_ACCESS_KEY:zhongyan}
      secret-key: ${BMS_MINIO_SECRET_KEY:zhongyan_minio_local}
      bucket: ${BMS_MINIO_BUCKET:zhongyan-uav-assets}
      region: ${BMS_MINIO_REGION:us-east-1}
      presigned-expiry: ${BMS_MINIO_PRESIGNED_EXPIRY:PT15M}
  geo:
    geoserver:
      enabled: ${BMS_GEOSERVER_ENABLED:true}
      url: ${BMS_GEOSERVER_URL:http://localhost:8080/geoserver}
      username: ${BMS_GEOSERVER_USERNAME:admin}
      password: ${BMS_GEOSERVER_PASSWORD:geoserver}
      workspace: ${BMS_GEOSERVER_WORKSPACE:zhongyan}
      datastore: ${BMS_GEOSERVER_DATASTORE:postgis}
      postgis-host: ${BMS_GEOSERVER_POSTGIS_HOST:postgres}
      postgis-port: ${BMS_GEOSERVER_POSTGIS_PORT:5432}
      postgis-database: ${BMS_GEOSERVER_POSTGIS_DATABASE:zhongyan_uav}
      postgis-schema: ${BMS_GEOSERVER_POSTGIS_SCHEMA:public}
      postgis-username: ${BMS_GEOSERVER_POSTGIS_USERNAME:zhongyan}
      postgis-password: ${BMS_GEOSERVER_POSTGIS_PASSWORD:zhongyan_local}
      table-name: ${BMS_GEOSERVER_TABLE_NAME:asset_geometry}
      layer-name: ${BMS_GEOSERVER_LAYER_NAME:asset_geometry}
      style-name: ${BMS_GEOSERVER_STYLE_NAME:asset-boundary}
      connect-timeout-ms: ${BMS_GEOSERVER_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${BMS_GEOSERVER_READ_TIMEOUT_MS:10000}
      retry-max-attempts: ${BMS_GEOSERVER_RETRY_MAX_ATTEMPTS:3}
      retry-backoff-ms: ${BMS_GEOSERVER_RETRY_BACKOFF_MS:500}
      circuit-failure-threshold: ${BMS_GEOSERVER_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-open-duration-ms: ${BMS_GEOSERVER_CIRCUIT_OPEN_DURATION_MS:30000}
  telemetry:
    udp:
      enabled: ${BMS_TELEMETRY_UDP_ENABLED:false}
      port: ${BMS_TELEMETRY_UDP_PORT:18088}
      buffer-bytes: ${BMS_TELEMETRY_UDP_BUFFER_BYTES:8192}
    kafka:
      enabled: ${BMS_TELEMETRY_KAFKA_ENABLED:false}
      topic: ${BMS_TELEMETRY_KAFKA_TOPIC:uav-telemetry}
