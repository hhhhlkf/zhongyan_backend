server:
  port: 8088
  servlet:
    context-path: /v2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: zhongyan-uav-backend

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  mvc:
    static-path-pattern: /**
    pathmatch:
      matching-strategy: ant_path_matcher
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  data:
    redis:
      repositories:
        enabled: false
  security:
    user:
      name: admin
      password: admin
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    time-zone: GMT+08:00
    date-format: yyyy-MM-dd HH:mm:ss
