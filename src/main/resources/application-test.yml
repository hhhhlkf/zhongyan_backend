spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  flyway:
    enabled: false

bms:
  repository:
    mode: mock
  device-mode: mock
  asset:
    storage:
      enabled: false
  geo:
    geoserver:
      enabled: false
  telemetry:
    udp:
      enabled: false
    kafka:
      enabled: false
  agent:
    enabled: false
    base-url: http://localhost:11434/v1
    api-key:
    chat-model: test-chat
    embedding-model: test-embedding
    max-tool-depth: 3
    stream-enabled: false
    approval-required-for-write: true
    events-topic: agent-events
    connect-timeout: PT1S
    read-timeout: PT5S
    redis:
      enabled: false
